name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: public/build/
          retention-days: 1

  deploy:
    name: Deploy to Hostinger via SSH
    needs: build-assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Directory and Pull Code via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST || '45.84.206.254' }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER || 'u134129778' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            APP_DIR="${{ secrets.HOSTINGER_APP_PATH || 'domains/moyassar.online/public_html' }}"
            mkdir -p ~/$APP_DIR
            cd ~/$APP_DIR || cd $APP_DIR

            # If not yet a git repository, initialize it
            if [ ! -d .git ]; then
              echo "🚀 First time setup: Initializing git repo in $APP_DIR..."
              git init
              git remote add origin https://github.com/Abdogoda/Alameen.git || git remote set-url origin https://github.com/Abdogoda/Alameen.git
              git fetch origin main
              git reset --hard origin/main
              rm -f default.php
            else
              if [ -f artisan ]; then
                php artisan down --retry=60 || true
              fi
              git fetch origin main
              git reset --hard origin/main
            fi

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
              php artisan key:generate --force || true
            fi

      - name: Download Compiled Assets
        uses: actions/download-artifact@v4
        with:
          name: compiled-assets
          path: public/build/

      - name: Sync Built Assets to Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST || '45.84.206.254' }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER || 'u134129778' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: 'public/build/*'
          target: '${{ secrets.HOSTINGER_APP_PATH || '\''domains/moyassar.online/public_html'\'' }}/public/build'
          strip_components: 2

      - name: Finish Deployment (Composer, Migrations & Caches)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST || '45.84.206.254' }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER || 'u134129778' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            APP_DIR="${{ secrets.HOSTINGER_APP_PATH || 'domains/moyassar.online/public_html' }}"
            cd ~/$APP_DIR || cd $APP_DIR

            # Install Composer dependencies
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            # Run database migrations
            echo "🗄️ Running database migrations..."
            php artisan migrate --force || echo "⚠️ Migrations skipped (check DB credentials in .env)"

            # Clear and rebuild cache
            echo "⚡ Optimizing Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Link storage
            php artisan storage:link || true

            # Bring site back online
            php artisan up || true

            echo "🚀 Deployment to Hostinger completed successfully!"
